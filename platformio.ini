[platformio]
default_envs = classic

[env]
; Using pioarduino fork for Arduino ESP32 Core 3.x support
; Official PlatformIO doesn't support Arduino framework for ESP32-C6
; See: https://github.com/pioarduino/platform-espressif32
platform = https://github.com/pioarduino/platform-espressif32.git#develop
board = esp32-c6-devkitc-1
framework = arduino

; Serial Monitor settings
monitor_speed = 115200
monitor_filters = direct

; Build flags
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -I include

; Library dependencies
lib_deps =
    lvgl/lvgl@^8.3.11

; Upload settings
upload_speed = 921600
upload_port = /dev/serial/by-id/usb-Espressif_USB_JTAG_serial_debug_unit_E4:B0:63:40:EA:6C-if00

[env:classic]
build_src_filter =
    +<*>
    -<ui_theme_telemetry.c>
    -<ui_theme_terminal.c>
    -<ui_theme_neon_status.c>

[env:telemetry]
build_src_filter =
    +<*>
    -<ui_hardware_monitor.c>
    -<ui_theme_terminal.c>
    -<ui_theme_neon_status.c>

[env:terminal]
build_src_filter =
    +<*>
    -<ui_hardware_monitor.c>
    -<ui_theme_telemetry.c>
    -<ui_theme_neon_status.c>

[env:neon-status]
build_src_filter =
    +<*>
    -<ui_hardware_monitor.c>
    -<ui_theme_telemetry.c>
    -<ui_theme_terminal.c>
